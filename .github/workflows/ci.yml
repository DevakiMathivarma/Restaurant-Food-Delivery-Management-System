name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env for testing
        run: |
          cp .env.example .env
          echo "DATABASE_URL=sqlite:///./test_food_delivery.db" >> .env
          echo "SECRET_KEY=ci-test-secret-key" >> .env
          echo "REDIS_HOST=localhost" >> .env

      - name: Run Pytest
        run: pytest -v

      - name: Check for Alembic migration drift
        run: |
          alembic init alembic_check || true
          echo "Migration check placeholder - run 'alembic revision --autogenerate' locally before pushing schema changes."